<text x="48" y="791" font-size="18" font-weight="bold">Interaction &amp; state notes</text>
<text x="48" y="824" font-size="14">01  ZIP stays text, preserving leading zeros. Search on submit only; show loading and prevent duplicate requests.</text>
<text x="48" y="855" font-size="14">02  One selected place ID drives both list highlighting and active map pin. Both support keyboard selection.</text>
<text x="48" y="886" font-size="14">03  Invalid input ≠ unresolved ZIP ≠ no hotels ≠ service failure. Clear obsolete results on a new search.</text>
<text x="48" y="917" font-size="14">04  Mobile: stack the map and result list. Tile failure leaves hotel data visible with a specific imagery warning.</text>
<text x="48" y="948" font-size="14">05  Legacy sample stays remain in a clearly labeled separate view. Shortlist work belongs to Part 2.</text>
