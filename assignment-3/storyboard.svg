<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160" role="img" aria-labelledby="title desc"><title id="title">A little space: annotated six-screen early storyboard</title><desc id="desc">Entry, ready, single breathing phase, model failure, ending and history. Each retains crisis support and leave. This is a fictional coursework design, not a running support tool.</desc><rect width="1500" height="1160" fill="#eeeee8"/><g font-family="Arial,sans-serif" fill="#293e3d"><text x="45" y="45" font-size="13" letter-spacing="2">ASSIGNMENT 3.1 · EARLY STORYBOARD · OCTOBER 15, 2026</text><text x="45" y="95" font-family="Georgia,serif" font-size="38">a little space.</text><text x="430" y="91" font-size="15">Fictional coursework prototype · Design before implementation</text><rect x="45" y="130" width="440" height="428" rx="18" fill="#fafbf6" stroke="#c0cdbf"/><text x="65" y="162" font-size="11" letter-spacing="1.2">01 · CHOOSE</text><rect x="65" y="178" width="146" height="33" rx="6" fill="#e3ebe2" stroke="#91a68e"/><text x="77" y="200" font-size="12">Crisis support</text><text x="395" y="200" font-size="12">Leave</text><text x="65" y="256" font-family="Georgia,serif" font-size="28">Choose a short practice.</text><text x="65" y="295" font-size="14" fill="#596f62">Paced breathing · about 1 minute</text><text x="65" y="326" font-size="14" fill="#596f62">Four counts in. Six counts out.</text><text x="65" y="357" font-size="14" fill="#596f62">Nothing starts until you choose.</text><rect x="65" y="391" width="400" height="47" rx="9" fill="#335a54"/><text x="265" y="421" text-anchor="middle" font-size="14" fill="white">Choose breathing</text><text x="65" y="468" font-size="12">Less on screen · History</text><path d="M65 491H465" stroke="#cbd5c7"/><text x="65" y="519" font-size="11">R4 / D3: no required message or mood rating.</text><rect x="530" y="130" width="440" height="428" rx="18" fill="#fafbf6" stroke="#c0cdbf"/><text x="550" y="162" font-size="11" letter-spacing="1.2">02 · READY</text><rect x="550" y="178" width="146" height="33" rx="6" fill="#e3ebe2" stroke="#91a68e"/><text x="562" y="200" font-size="12">Crisis support</text><text x="880" y="200" font-size="12">Leave</text><text x="550" y="256" font-family="Georgia,serif" font-size="28">A minute, if you choose.</text><text x="550" y="295" font-size="14" fill="#596f62">Inhale for 4. Exhale for 6.</text><text x="550" y="326" font-size="14" fill="#596f62">Repeat six times, if comfortable.</text><text x="550" y="357" font-size="14" fill="#596f62">The model never controls these steps.</text><rect x="550" y="391" width="400" height="47" rx="9" fill="#335a54"/><text x="750" y="421" text-anchor="middle" font-size="14" fill="white">Start</text><text x="550" y="468" font-size="12">Back to choices · Without motion</text><path d="M550 491H950" stroke="#cbd5c7"/><text x="550" y="519" font-size="11">R1 / D6: 60-second plan; static pacing alternative.</text><rect x="1015" y="130" width="440" height="428" rx="18" fill="#fafbf6" stroke="#c0cdbf"/><text x="1035" y="162" font-size="11" letter-spacing="1.2">03 · ONE ACTION</text><rect x="1035" y="178" width="146" height="33" rx="6" fill="#e3ebe2" stroke="#91a68e"/><text x="1047" y="200" font-size="12">Crisis support</text><text x="1365" y="200" font-size="12">Leave</text><text x="1035" y="256" font-family="Georgia,serif" font-size="28">Breathe out.</text><text x="1035" y="295" font-size="36" fill="#596f62">6</text><text x="1035" y="326" font-size="14" fill="#596f62">counts out · round 1 of 6</text><text x="1035" y="357" font-size="14" fill="#596f62">Static sketch of the pacing cue</text><rect x="1035" y="391" width="400" height="47" rx="9" fill="#335a54"/><text x="1235" y="421" text-anchor="middle" font-size="14" fill="white">Pause</text><text x="1035" y="468" font-size="12">Stop</text><path d="M1035 491H1435" stroke="#cbd5c7"/><text x="1035" y="519" font-size="11">D2 / D4: one phase, with safety and stop visible.</text><rect x="45" y="592" width="440" height="428" rx="18" fill="#fafbf6" stroke="#c0cdbf"/><text x="65" y="624" font-size="11" letter-spacing="1.2">04 · MODEL FAILURE</text><rect x="65" y="640" width="146" height="33" rx="6" fill="#e3ebe2" stroke="#91a68e"/><text x="77" y="662" font-size="12">Crisis support</text><text x="395" y="662" font-size="12">Leave</text><text x="65" y="718" font-family="Georgia,serif" font-size="25">The message couldn’t load.</text><text x="65" y="757" font-size="14" fill="#596f62">The practice is still available.</text><text x="65" y="788" font-size="14" fill="#596f62">Continue without a reply.</text><text x="65" y="819" font-size="14" fill="#596f62">Late messages cannot interrupt a skill.</text><rect x="65" y="853" width="400" height="47" rx="9" fill="#335a54"/><text x="265" y="883" text-anchor="middle" font-size="14" fill="white">Continue to practice</text><text x="65" y="930" font-size="12">Retry · Leave message</text><path d="M65 953H465" stroke="#cbd5c7"/><text x="65" y="981" font-size="11">R2 / R3: model failure never blocks support or exit.</text><rect x="530" y="592" width="440" height="428" rx="18" fill="#fafbf6" stroke="#c0cdbf"/><text x="550" y="624" font-size="11" letter-spacing="1.2">05 · ENDING</text><rect x="550" y="640" width="146" height="33" rx="6" fill="#e3ebe2" stroke="#91a68e"/><text x="562" y="662" font-size="12">Crisis support</text><text x="880" y="662" font-size="12">Leave</text><text x="550" y="718" font-family="Georgia,serif" font-size="28">You can leave it here.</text><text x="550" y="757" font-size="14" fill="#596f62">The minute is over.</text><text x="550" y="788" font-size="14" fill="#596f62">Nothing else is required.</text><text x="550" y="819" font-size="14" fill="#596f62">No score, streak or required feedback.</text><rect x="550" y="853" width="400" height="47" rx="9" fill="#335a54"/><text x="750" y="883" text-anchor="middle" font-size="14" fill="white">Done</text><text x="550" y="930" font-size="12">Use this as my usual (optional)</text><path d="M550 953H950" stroke="#cbd5c7"/><text x="550" y="981" font-size="11">D5 / R4: remember only by explicit choice.</text><rect x="1015" y="592" width="440" height="428" rx="18" fill="#fafbf6" stroke="#c0cdbf"/><text x="1035" y="624" font-size="11" letter-spacing="1.2">06 · REVIEW</text><rect x="1035" y="640" width="146" height="33" rx="6" fill="#e3ebe2" stroke="#91a68e"/><text x="1047" y="662" font-size="12">Crisis support</text><text x="1365" y="662" font-size="12">Leave</text><text x="1035" y="718" font-family="Georgia,serif" font-size="28">Your past choices.</text><text x="1035" y="757" font-size="14" fill="#596f62">October 15 · fictional fixture</text><text x="1035" y="788" font-size="14" fill="#596f62">Paced breathing · Left early</text><text x="1035" y="819" font-size="14" fill="#596f62">Conversation details open on request.</text><rect x="1035" y="853" width="400" height="47" rx="9" fill="#335a54"/><text x="1235" y="883" text-anchor="middle" font-size="14" fill="white">Back to choices</text><text x="1035" y="930" font-size="12">Delete session + related usual choice</text><path d="M1035 953H1435" stroke="#cbd5c7"/><text x="1035" y="981" font-size="11">D3 / D5: inspectable local history and deletion.</text><rect x="45" y="1075" width="1410" height="50" rx="10" fill="#dce6da"/><text x="65" y="1105" font-size="14">GLOBAL: support + leave remain visible · Simpler mode is chosen, never inferred · Skill steps and timing stay in the application</text></g></svg>
